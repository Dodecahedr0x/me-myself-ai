<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="app-token" content="__APP_TOKEN__">
  <meta name="color-scheme" content="light">
  <title>MeMyselfAI</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to workspace</a>
  <aside id="sidebar" aria-label="Workspace navigation"></aside>
  <button id="scrim" aria-label="Close navigation" hidden></button>
  <div class="workspace">
    <header id="bar"></header>
    <div class="network" id="network" role="alert" hidden></div>
    <main id="main" tabindex="-1"><p class="loading">Opening workspace…</p></main>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
  <div id="notice" role="status" aria-live="polite"></div>
</body>
</html>
